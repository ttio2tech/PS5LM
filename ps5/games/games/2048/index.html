<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2048</title>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<link rel="stylesheet" href="../../lib/kit.css">
<style>
  .board { position: relative; background: #151c30; border-radius: 14px; padding: 12px; box-sizing: border-box;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px; }
  .cell, .t { border-radius: 10px; }
  .cell { background: rgba(255, 255, 255, 0.05); }
  .t { display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1b1b1b; }
  .t.pop { -webkit-animation: pop 0.16s ease; animation: pop 0.16s ease; }
  @-webkit-keyframes pop { 0% { -webkit-transform: scale(0.6); } 100% { -webkit-transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="kit-stage"><div class="board" id="board"></div></div>
<script src="../../lib/kit.js"></script>
<script>
(function () {
  'use strict';
  var N = 4;
  var COLORS = {
    2: ['#eee4da', '#1b1b1b'], 4: ['#ede0c8', '#1b1b1b'], 8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'],
    32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'], 128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'],
    512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'], 2048: ['#edc22e', '#fff']
  };
  var board = document.getElementById('board');
  var grid, score, state, won, born;

  Kit.init({
    id: '2048', name: '2048',
    controls: [['D-pad', 'Slide the tiles'], ['Square', 'New game'], ['Options', 'Pause']],
    touch: [['x', '↺']]
  });

  function size() {
    var bar = document.querySelector('.kit-bar'), touch = document.querySelector('.kit-touch');
    var s = Math.min(window.innerWidth - 32, window.innerHeight - bar.offsetHeight - (touch ? touch.offsetHeight : 0) - 32, 720);
    board.style.width = s + 'px';
    board.style.height = s + 'px';
    board.style.fontSize = (s / 11) + 'px';
  }
  window.addEventListener('resize', size);
  size();

  function empty() {
    var out = [];
    for (var y = 0; y < N; y++) { for (var x = 0; x < N; x++) { if (!grid[y][x]) { out.push([x, y]); } } }
    return out;
  }

  function add() {
    var e = empty();
    if (!e.length) { return; }
    var p = e[Math.floor(Math.random() * e.length)];
    grid[p[1]][p[0]] = Math.random() < 0.9 ? 2 : 4;
    born[p[1] + ',' + p[0]] = true;
  }

  function begin() {
    grid = [];
    for (var y = 0; y < N; y++) { grid.push([0, 0, 0, 0]); }
    score = 0; won = false; born = {};
    Kit.setScore(0);
    add(); add();
    state = 'playing';
    Kit.banner(null);
    draw();
  }

  // Slides one line toward its start; returns [line, points].
  function slide(line) {
    var vals = line.filter(function (v) { return v; });
    var out = [], pts = 0, merged = [];
    for (var i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
        out.push(vals[i] * 2);
        merged.push(out.length - 1);
        pts += vals[i] * 2;
        i++;
      } else {
        out.push(vals[i]);
      }
    }
    while (out.length < N) { out.push(0); }
    return [out, pts, merged];
  }

  function move(dir) {
    var moved = false;
    born = {};
    for (var i = 0; i < N; i++) {
      var line = [], k;
      for (k = 0; k < N; k++) { line.push(at(dir, i, k)); }
      var r = slide(line);
      for (k = 0; k < N; k++) {
        if (r[0][k] !== line[k]) { moved = true; }
        put(dir, i, k, r[0][k]);
      }
      for (var m = 0; m < r[2].length; m++) { born[key(dir, i, r[2][m])] = true; }
      score += r[1];
    }
    if (!moved) { return; }
    add();
    Kit.setScore(score);
    draw();
    if (!won && has(2048)) {
      won = true;
      Kit.submit(score);
      Kit.banner('2048!', 'You made it. Keep going for a higher score.', '✕  Keep going');
      state = 'won';
      return;
    }
    if (!canMove()) {
      state = 'over';
      var best = Kit.submit(score);
      Kit.banner('No moves left', 'Score ' + score + (best ? ' · new best!' : ''), '✕  New game');
    }
  }

  // Line i, position k, read in the direction of the slide.
  function coords(dir, i, k) {
    if (dir === 'left') { return [k, i]; }
    if (dir === 'right') { return [N - 1 - k, i]; }
    if (dir === 'up') { return [i, k]; }
    return [i, N - 1 - k];
  }
  function at(dir, i, k) { var c = coords(dir, i, k); return grid[c[1]][c[0]]; }
  function put(dir, i, k, v) { var c = coords(dir, i, k); grid[c[1]][c[0]] = v; }
  function key(dir, i, k) { var c = coords(dir, i, k); return c[1] + ',' + c[0]; }

  function has(v) {
    for (var y = 0; y < N; y++) { for (var x = 0; x < N; x++) { if (grid[y][x] >= v) { return true; } } }
    return false;
  }

  function canMove() {
    if (empty().length) { return true; }
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (x + 1 < N && grid[y][x] === grid[y][x + 1]) { return true; }
        if (y + 1 < N && grid[y][x] === grid[y + 1][x]) { return true; }
      }
    }
    return false;
  }

  function draw() {
    board.innerHTML = '';
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var v = grid[y][x];
        var d = document.createElement('div');
        if (!v) {
          d.className = 'cell';
        } else {
          var c = COLORS[v] || ['#3c3a32', '#fff'];
          d.className = 't' + (born[y + ',' + x] ? ' pop' : '');
          d.style.background = c[0];
          d.style.color = c[1];
          d.style.fontSize = v >= 1024 ? '0.75em' : v >= 128 ? '0.9em' : '1.1em';
          d.textContent = v;
        }
        board.appendChild(d);
      }
    }
  }

  Kit.on(function (action) {
    if (state === 'won' && action === 'a') { state = 'playing'; Kit.banner(null); return; }
    if (state !== 'playing') {
      if (action === 'a') { begin(); }
      return;
    }
    if (action === 'x') { begin(); return; }
    if (action === 'up' || action === 'down' || action === 'left' || action === 'right') { move(action); }
  });

  // Swipes on a phone.
  var sx = 0, sy = 0;
  board.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
  board.addEventListener('touchmove', function (e) { e.preventDefault(); });
  board.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (state !== 'playing' || Math.max(Math.abs(dx), Math.abs(dy)) < 30) { return; }
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  begin();
})();
</script>
</body>
</html>
